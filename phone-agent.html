<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL-X | Mobile Agent</title>
    <style>
        :root {
            --bg: #0f0f12;
            --card: #16161a;
            --text: #ececed;
            --accent: #1d9e75;
            --border: #2a2a32;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.2rem; margin-bottom: 8px; color: var(--accent); }
        p { font-size: 0.9rem; color: #888; margin-bottom: 24px; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; color: #aaa; }
        input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            margin-bottom: 16px;
            box-sizing: border-box;
            font-family: monospace;
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:disabled { background: #333; cursor: not-allowed; }
        #log {
            margin-top: 20px;
            font-size: 0.8rem;
            height: 150px;
            overflow-y: auto;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            color: #0f0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SENTINEL-X Agent</h1>
        <p>Device: Mobile-Agent-01</p>
        
        <label>Gateway Address</label>
        <input type="text" id="address" placeholder="ws://192.168.1.XX:6767" value="ws://">
        
        <button id="connectBtn" onclick="toggleConnection()">Connect to Gateway</button>
        
        <div id="log">System ready...</div>
    </div>

    <script>
        let socket = null;
        let interval = null;
        const logEl = document.getElementById('log');
        const btn = document.getElementById('connectBtn');

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `<div>[${time}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function toggleConnection() {
            if (socket) {
                stop();
            } else {
                start();
            }
        }

        function start() {
            const addr = document.getElementById('address').value;
            if (!addr.startsWith('ws')) return alert("Use ws://IP:PORT");

            socket = new WebSocket(addr);
            btn.innerText = "Connecting...";
            btn.disabled = true;

            socket.onopen = () => {
                log("Connected to SENTINEL-X");
                btn.innerText = "Disconnect";
                btn.disabled = false;
                btn.style.background = "#e24b4a";

                // Start sending mock sensor data every 3 seconds
                interval = setInterval(() => {
                    const mockData = {
                        device_id: "Mobile-Agent-01",
                        payload: JSON.stringify({
                            temp: (20 + Math.random() * 10).toFixed(2),
                            uptime: Math.floor(performance.now() / 1000)
                        })
                    };
                    socket.send(JSON.stringify(mockData));
                    log(`Sent: ${mockData.payload}`);
                }, 3000);
            };

            socket.onclose = () => {
                log("Disconnected.");
                stop();
            };

            socket.onerror = () => {
                log("Error: Check IP and Firewall.");
                stop();
            };
        }

        function stop() {
            if (interval) clearInterval(interval);
            if (socket) socket.close();
            socket = null;
            btn.innerText = "Connect to Gateway";
            btn.disabled = false;
            btn.style.background = "#1d9e75";
        }
    </script>
</body>
</html>
